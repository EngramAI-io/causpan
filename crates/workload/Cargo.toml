[package]
name = "workload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Controlled Tokio workload that generates ground-truth and kernel-visible side effects"

[dependencies]
causpan-core = { path = "../causpan-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = { version = "0.9", features = ["os_rng", "std_rng"] }
libc = "0.2"
