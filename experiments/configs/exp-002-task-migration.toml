// Experiment 2: Task migration stress
//
// Force Tokio to migrate tasks across worker threads by using more worker
// threads and many concurrent RPCs.  Measure whether attribution accuracy
// degrades under migration.

[experiment]
name = "exp-002-task-migration"
description = "Stress attribution accuracy under forced task migration across Tokio worker threads."
tags = ["migration", "worker_threads", "stress"]
runs_per_config = 3
output_dir = "results/exp-002"

[workload]
concurrency = [8, 16, 32]
operations_per_rpc = 8
scenario = "mixed"
seed = 42
# TODO: Cross worker_threads as an experiment dimension. For now, fixed at 4.
worker_threads = 4
net_host = "127.0.0.1"
net_port = 9999
data_dir = "/tmp/causpan"

[evaluator]
time_windows_ms = [1, 5, 10, 50, 100, 500]

[strace]
syscalls = "openat,read,write,socket,connect,clone,fork,execve"
