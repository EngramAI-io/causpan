[workspace]
resolver = "2"
members = [
    "crates/causpan-core",
    "crates/workload",
    "crates/collector",
    "crates/evaluator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Causpan Research"]
license = "MIT"

[workspace.dependencies]
causpan-core = { path = "crates/causpan-core" }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
